test: analytics.tracking.mock.validate_http_mock200_database_5
description: Validating http_mock200_database behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: database
  mock:
    response:
      status: 400
      latency: 50ms
  query: SELECT * FROM table_7
- name: step_1
  protocol: http
  mock:
    response:
      status: 502
      latency: 200ms
  endpoint: /api/v1/resource/60
  method: PUT
- name: step_2
  protocol: kafka
  mock:
    response:
      status: 200
      latency: 1s
  topic: events.50
- name: step_3
  protocol: http
  mock:
    response:
      status: 403
      latency: 100ms
  endpoint: /api/v1/resource/791
  method: DELETE
