test: analytics.tracking.mock.validate_async_kafka_http_7
description: Validating async_kafka_http behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: kafka
  mock:
    response:
      status: 503
      latency: ${$random.int(10,100)}ms
  async: true
  topic: events.13
- name: step_1
  protocol: http
  mock:
    response:
      status: 201
      latency: 100ms
  async: true
  endpoint: /api/v1/resource/66
  method: GET
- name: step_2
  protocol: kafka
  mock:
    response:
      status: 202
      latency: 10ms
  async: true
  topic: events.100
- name: step_3
  protocol: database
  mock:
    response:
      status: 403
      latency: 200ms
  async: true
  wait_for:
  - step_0
  query: SELECT * FROM table_6
