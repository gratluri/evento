test: infra.health.mock.validate_database_mock201_sync_11
description: Validating database_mock201_sync behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: kafka
  mock:
    response:
      status: 502
      latency: 1s
  topic: events.72
- name: step_1
  protocol: database
  mock:
    response:
      status: 502
      latency: ${$random.int(10,100)}ms
  wait_for:
  - step_0
  query: SELECT * FROM table_7
- name: step_2
  protocol: database
  mock:
    response:
      status: 201
      latency: 10ms
  query: SELECT * FROM table_3
- name: step_3
  protocol: database
  mock:
    response:
      status: 401
      latency: 100ms
  query: SELECT * FROM table_7
- name: step_4
  protocol: database
  mock:
    response:
      status: 502
      latency: ${$random.int(10,100)}ms
  query: SELECT * FROM table_1
