test: sales.buyflow.mock.validate_async_http_database_12
description: Validating async_http_database behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: database
  mock:
    response:
      status: 404
      latency: 100ms
  query: SELECT * FROM table_5
- name: step_1
  protocol: http
  mock:
    response:
      status: 500
      latency: 500ms
  endpoint: /api/v1/resource/808
  method: PUT
- name: step_2
  protocol: kafka
  mock:
    response:
      status: 201
      latency: ${$random.int(10,100)}ms
  async: true
  topic: events.49
- name: step_3
  protocol: kafka
  mock:
    response:
      status: 204
      latency: 50ms
  wait_for:
  - step_0
  topic: events.55
