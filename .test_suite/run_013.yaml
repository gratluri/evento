test: analytics.tracking.mock.validate_async_http_database_13
description: Validating async_http_database behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: database
  mock:
    response:
      status: 401
      latency: 200ms
  query: SELECT * FROM table_10
- name: step_1
  protocol: http
  mock:
    response:
      status: 502
      latency: 200ms
  async: true
  endpoint: /api/v1/resource/724
  method: PUT
