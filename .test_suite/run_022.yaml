test: analytics.tracking.mock.validate_mock503_http_database_22
description: Validating mock503_http_database behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: http
  mock:
    response:
      status: 502
      latency: 10ms
  endpoint: /api/v1/resource/111
  method: PUT
- name: step_1
  protocol: database
  mock:
    response:
      status: 404
      latency: 1s
  wait_for:
  - step_0
  query: SELECT * FROM table_4
- name: step_2
  protocol: kafka
  mock:
    response:
      status: 500
      latency: 1s
  topic: events.94
- name: step_3
  protocol: database
  mock:
    response:
      status: 502
      latency: 50ms
  query: SELECT * FROM table_2
- name: step_4
  protocol: database
  mock:
    response:
      status: 503
      latency: ${$random.int(10,100)}ms
  query: SELECT * FROM table_10
