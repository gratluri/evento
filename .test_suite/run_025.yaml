test: analytics.tracking.mock.validate_async_http_mock200_25
description: Validating async_http_mock200 behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: database
  mock:
    response:
      status: 500
      latency: 1s
  async: true
  query: SELECT * FROM table_7
- name: step_1
  protocol: http
  mock:
    response:
      status: 201
      latency: ${$random.int(10,100)}ms
  endpoint: /api/v1/resource/205
  method: PUT
- name: step_2
  protocol: kafka
  mock:
    response:
      status: 200
      latency: 1s
  async: true
  topic: events.70
