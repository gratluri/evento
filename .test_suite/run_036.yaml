test: analytics.tracking.mock.validate_database_sync_mock204_36
description: Validating database_sync_mock204 behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: database
  mock:
    response:
      status: 502
      latency: 10ms
  query: SELECT * FROM table_10
- name: step_1
  protocol: kafka
  mock:
    response:
      status: 204
      latency: 1s
  wait_for:
  - step_0
  topic: events.55
- name: step_2
  protocol: database
  mock:
    response:
      status: 204
      latency: 1s
  wait_for:
  - step_0
  query: SELECT * FROM table_2
- name: step_3
  protocol: database
  mock:
    response:
      status: 500
      latency: ${$random.int(10,100)}ms
  wait_for:
  - step_0
  query: SELECT * FROM table_1
