test: sales.buyflow.mock.validate_async_database_sync_39
description: Validating async_database_sync behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: database
  mock:
    response:
      status: 404
      latency: 50ms
  query: SELECT * FROM table_8
- name: step_1
  protocol: database
  mock:
    response:
      status: 400
      latency: 50ms
  async: true
  wait_for:
  - step_0
  query: SELECT * FROM table_3
