test: analytics.tracking.mock.validate_async_mock503_http_40
description: Validating async_mock503_http behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: http
  mock:
    response:
      status: 503
      latency: 10ms
  endpoint: /api/v1/resource/625
  method: DELETE
- name: step_1
  protocol: kafka
  mock:
    response:
      status: 200
      latency: 1s
  wait_for:
  - step_0
  topic: events.68
- name: step_2
  protocol: database
  mock:
    response:
      status: 502
      latency: 10ms
  query: SELECT * FROM table_5
- name: step_3
  protocol: database
  mock:
    response:
      status: 403
      latency: 1s
  query: SELECT * FROM table_6
- name: step_4
  protocol: http
  mock:
    response:
      status: 202
      latency: 100ms
  async: true
  endpoint: /api/v1/resource/869
  method: POST
