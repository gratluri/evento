test: analytics.tracking.mock.validate_async_kafka_http_42
description: Validating async_kafka_http behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: database
  mock:
    response:
      status: 201
      latency: ${$random.int(10,100)}ms
  async: true
  query: SELECT * FROM table_10
- name: step_1
  protocol: http
  mock:
    response:
      status: 500
      latency: ${$random.int(10,100)}ms
  endpoint: /api/v1/resource/136
  method: POST
- name: step_2
  protocol: http
  mock:
    response:
      status: 503
      latency: 1s
  endpoint: /api/v1/resource/140
  method: GET
- name: step_3
  protocol: kafka
  mock:
    response:
      status: 201
      latency: 10ms
  wait_for:
  - step_1
  topic: events.46
- name: step_4
  protocol: http
  mock:
    response:
      status: 503
      latency: 200ms
  endpoint: /api/v1/resource/223
  method: POST
- name: step_5
  protocol: kafka
  mock:
    response:
      status: 200
      latency: ${$random.int(10,100)}ms
  wait_for:
  - step_1
  topic: events.67
- name: step_6
  protocol: database
  mock:
    response:
      status: 201
      latency: 50ms
  wait_for:
  - step_3
  query: SELECT * FROM table_6
- name: step_7
  protocol: http
  mock:
    response:
      status: 202
      latency: 50ms
  endpoint: /api/v1/resource/708
  method: DELETE
- name: step_8
  protocol: kafka
  mock:
    response:
      status: 503
      latency: 500ms
  async: true
  wait_for:
  - step_2
  topic: events.5
- name: step_9
  protocol: database
  mock:
    response:
      status: 403
      latency: ${$random.int(10,100)}ms
  async: true
  query: SELECT * FROM table_9
