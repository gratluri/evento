test: sales.buyflow.mock.validate_async_http_database_48
description: Validating async_http_database behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: kafka
  mock:
    response:
      status: 204
      latency: 10ms
  topic: events.40
- name: step_1
  protocol: database
  mock:
    response:
      status: 400
      latency: 1s
  query: SELECT * FROM table_3
- name: step_2
  protocol: kafka
  mock:
    response:
      status: 500
      latency: 1s
  topic: events.71
- name: step_3
  protocol: http
  mock:
    response:
      status: 204
      latency: 50ms
  endpoint: /api/v1/resource/758
  method: DELETE
- name: step_4
  protocol: database
  mock:
    response:
      status: 201
      latency: ${$random.int(10,100)}ms
  async: true
  wait_for:
  - step_3
  query: SELECT * FROM table_10
- name: step_5
  protocol: kafka
  mock:
    response:
      status: 403
      latency: 10ms
  topic: events.77
- name: step_6
  protocol: http
  mock:
    response:
      status: 400
      latency: 10ms
  endpoint: /api/v1/resource/48
  method: POST
- name: step_7
  protocol: database
  mock:
    response:
      status: 204
      latency: 100ms
  query: SELECT * FROM table_10
- name: step_8
  protocol: http
  mock:
    response:
      status: 404
      latency: ${$random.int(10,100)}ms
  async: true
  endpoint: /api/v1/resource/841
  method: PUT
- name: step_9
  protocol: kafka
  mock:
    response:
      status: 204
      latency: ${$random.int(10,100)}ms
  topic: events.43
