test: sales.buyflow.mock.validate_async_mock503_database_50
description: Validating async_mock503_database behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: database
  mock:
    response:
      status: 403
      latency: ${$random.int(10,100)}ms
  async: true
  query: SELECT * FROM table_10
- name: step_1
  protocol: database
  mock:
    response:
      status: 404
      latency: 1s
  query: SELECT * FROM table_2
- name: step_2
  protocol: kafka
  mock:
    response:
      status: 503
      latency: 200ms
  wait_for:
  - step_1
  topic: events.22
