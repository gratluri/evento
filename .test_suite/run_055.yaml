test: sales.buyflow.mock.validate_async_http_mock200_55
description: Validating async_http_mock200 behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: kafka
  mock:
    response:
      status: 401
      latency: 100ms
  topic: events.78
- name: step_1
  protocol: http
  mock:
    response:
      status: 204
      latency: 500ms
  async: true
  endpoint: /api/v1/resource/401
  method: GET
- name: step_2
  protocol: kafka
  mock:
    response:
      status: 200
      latency: 500ms
  async: true
  wait_for:
  - step_1
  topic: events.36
- name: step_3
  protocol: kafka
  mock:
    response:
      status: 403
      latency: 1s
  async: true
  wait_for:
  - step_2
  topic: events.91
- name: step_4
  protocol: database
  mock:
    response:
      status: 400
      latency: 500ms
  query: SELECT * FROM table_9
- name: step_5
  protocol: kafka
  mock:
    response:
      status: 200
      latency: 100ms
  topic: events.74
- name: step_6
  protocol: database
  mock:
    response:
      status: 201
      latency: 100ms
  query: SELECT * FROM table_8
