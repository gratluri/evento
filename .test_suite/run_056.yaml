test: sales.buyflow.mock.validate_async_http_mock200_56
description: Validating async_http_mock200 behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: kafka
  mock:
    response:
      status: 200
      latency: 1s
  async: true
  topic: events.13
- name: step_1
  protocol: http
  mock:
    response:
      status: 502
      latency: 500ms
  endpoint: /api/v1/resource/363
  method: DELETE
- name: step_2
  protocol: database
  mock:
    response:
      status: 201
      latency: ${$random.int(10,100)}ms
  query: SELECT * FROM table_5
