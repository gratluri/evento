test: infra.health.mock.validate_async_database_mock201_58
description: Validating async_database_mock201 behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: database
  mock:
    response:
      status: 201
      latency: 500ms
  async: true
  query: SELECT * FROM table_6
- name: step_1
  protocol: database
  mock:
    response:
      status: 201
      latency: 1s
  query: SELECT * FROM table_8
- name: step_2
  protocol: database
  mock:
    response:
      status: 404
      latency: 50ms
  wait_for:
  - step_0
  query: SELECT * FROM table_7
- name: step_3
  protocol: database
  mock:
    response:
      status: 500
      latency: ${$random.int(10,100)}ms
  query: SELECT * FROM table_8
