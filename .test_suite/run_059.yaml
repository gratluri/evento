test: analytics.tracking.mock.validate_mock202_http_database_59
description: Validating mock202_http_database behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: kafka
  mock:
    response:
      status: 202
      latency: 200ms
  topic: events.47
- name: step_1
  protocol: database
  mock:
    response:
      status: 204
      latency: 500ms
  wait_for:
  - step_0
  query: SELECT * FROM table_10
- name: step_2
  protocol: http
  mock:
    response:
      status: 404
      latency: 100ms
  wait_for:
  - step_1
  endpoint: /api/v1/resource/131
  method: GET
- name: step_3
  protocol: kafka
  mock:
    response:
      status: 403
      latency: 1s
  topic: events.72
- name: step_4
  protocol: kafka
  mock:
    response:
      status: 400
      latency: 200ms
  topic: events.83
- name: step_5
  protocol: kafka
  mock:
    response:
      status: 401
      latency: ${$random.int(10,100)}ms
  topic: events.79
- name: step_6
  protocol: http
  mock:
    response:
      status: 202
      latency: 1s
  endpoint: /api/v1/resource/409
  method: PUT
