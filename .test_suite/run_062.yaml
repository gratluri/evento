test: sales.buyflow.mock.validate_async_http_database_62
description: Validating async_http_database behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: kafka
  mock:
    response:
      status: 204
      latency: ${$random.int(10,100)}ms
  topic: events.67
- name: step_1
  protocol: database
  mock:
    response:
      status: 502
      latency: 1s
  query: SELECT * FROM table_9
- name: step_2
  protocol: http
  mock:
    response:
      status: 502
      latency: 10ms
  async: true
  wait_for:
  - step_1
  endpoint: /api/v1/resource/919
  method: DELETE
- name: step_3
  protocol: http
  mock:
    response:
      status: 502
      latency: ${$random.int(10,100)}ms
  endpoint: /api/v1/resource/744
  method: DELETE
