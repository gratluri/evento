test: sales.buyflow.mock.validate_kafka_async_http_64
description: Validating kafka_async_http behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: kafka
  mock:
    response:
      status: 404
      latency: 200ms
  topic: events.100
- name: step_1
  protocol: kafka
  mock:
    response:
      status: 503
      latency: 500ms
  topic: events.68
- name: step_2
  protocol: http
  mock:
    response:
      status: 500
      latency: 200ms
  wait_for:
  - step_1
  endpoint: /api/v1/resource/371
  method: POST
- name: step_3
  protocol: http
  mock:
    response:
      status: 201
      latency: 10ms
  endpoint: /api/v1/resource/458
  method: PUT
- name: step_4
  protocol: database
  mock:
    response:
      status: 403
      latency: 1s
  query: SELECT * FROM table_7
- name: step_5
  protocol: database
  mock:
    response:
      status: 404
      latency: 500ms
  query: SELECT * FROM table_5
- name: step_6
  protocol: http
  mock:
    response:
      status: 500
      latency: 1s
  async: true
  endpoint: /api/v1/resource/278
  method: PUT
- name: step_7
  protocol: http
  mock:
    response:
      status: 500
      latency: 50ms
  async: true
  endpoint: /api/v1/resource/275
  method: PUT
- name: step_8
  protocol: kafka
  mock:
    response:
      status: 202
      latency: 50ms
  wait_for:
  - step_6
  topic: events.10
