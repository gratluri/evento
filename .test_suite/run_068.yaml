test: sales.buyflow.mock.validate_async_mock202_http_68
description: Validating async_mock202_http behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: kafka
  mock:
    response:
      status: 202
      latency: ${$random.int(10,100)}ms
  topic: events.31
- name: step_1
  protocol: database
  mock:
    response:
      status: 401
      latency: 50ms
  query: SELECT * FROM table_10
- name: step_2
  protocol: http
  mock:
    response:
      status: 401
      latency: 200ms
  async: true
  endpoint: /api/v1/resource/260
  method: PUT
- name: step_3
  protocol: kafka
  mock:
    response:
      status: 500
      latency: 200ms
  topic: events.82
- name: step_4
  protocol: kafka
  mock:
    response:
      status: 502
      latency: 500ms
  async: true
  topic: events.80
- name: step_5
  protocol: http
  mock:
    response:
      status: 201
      latency: ${$random.int(10,100)}ms
  endpoint: /api/v1/resource/563
  method: PUT
