test: analytics.tracking.mock.validate_http_database_mock201_71
description: Validating http_database_mock201 behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: kafka
  mock:
    response:
      status: 201
      latency: ${$random.int(10,100)}ms
  topic: events.89
- name: step_1
  protocol: database
  mock:
    response:
      status: 204
      latency: 1s
  wait_for:
  - step_0
  query: SELECT * FROM table_5
- name: step_2
  protocol: http
  mock:
    response:
      status: 403
      latency: 50ms
  endpoint: /api/v1/resource/917
  method: PUT
