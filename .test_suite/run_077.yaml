test: analytics.tracking.mock.validate_async_http_mock200_77
description: Validating async_http_mock200 behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: database
  mock:
    response:
      status: 200
      latency: 10ms
  async: true
  query: SELECT * FROM table_1
- name: step_1
  protocol: http
  mock:
    response:
      status: 500
      latency: 100ms
  wait_for:
  - step_0
  endpoint: /api/v1/resource/733
  method: GET
- name: step_2
  protocol: kafka
  mock:
    response:
      status: 204
      latency: ${$random.int(10,100)}ms
  topic: events.89
- name: step_3
  protocol: kafka
  mock:
    response:
      status: 201
      latency: 100ms
  topic: events.59
- name: step_4
  protocol: http
  mock:
    response:
      status: 403
      latency: 200ms
  endpoint: /api/v1/resource/797
  method: POST
- name: step_5
  protocol: database
  mock:
    response:
      status: 500
      latency: 50ms
  wait_for:
  - step_0
  query: SELECT * FROM table_6
