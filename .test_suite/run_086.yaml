test: analytics.tracking.mock.validate_async_mock503_http_86
description: Validating async_mock503_http behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: kafka
  mock:
    response:
      status: 403
      latency: 1s
  topic: events.53
- name: step_1
  protocol: database
  mock:
    response:
      status: 401
      latency: 500ms
  query: SELECT * FROM table_1
- name: step_2
  protocol: http
  mock:
    response:
      status: 200
      latency: 10ms
  async: true
  wait_for:
  - step_1
  endpoint: /api/v1/resource/511
  method: DELETE
- name: step_3
  protocol: database
  mock:
    response:
      status: 503
      latency: 50ms
  query: SELECT * FROM table_9
- name: step_4
  protocol: database
  mock:
    response:
      status: 201
      latency: ${$random.int(10,100)}ms
  async: true
  query: SELECT * FROM table_6
- name: step_5
  protocol: http
  mock:
    response:
      status: 400
      latency: 500ms
  wait_for:
  - step_4
  endpoint: /api/v1/resource/381
  method: DELETE
- name: step_6
  protocol: http
  mock:
    response:
      status: 500
      latency: 10ms
  async: true
  endpoint: /api/v1/resource/243
  method: PUT
- name: step_7
  protocol: kafka
  mock:
    response:
      status: 404
      latency: 1s
  topic: events.54
- name: step_8
  protocol: http
  mock:
    response:
      status: 503
      latency: 200ms
  endpoint: /api/v1/resource/405
  method: PUT
- name: step_9
  protocol: http
  mock:
    response:
      status: 202
      latency: ${$random.int(10,100)}ms
  async: true
  endpoint: /api/v1/resource/860
  method: DELETE
