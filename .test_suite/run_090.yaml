test: sales.buyflow.mock.validate_async_mock503_http_90
description: Validating async_mock503_http behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: database
  mock:
    response:
      status: 201
      latency: 100ms
  query: SELECT * FROM table_10
- name: step_1
  protocol: kafka
  mock:
    response:
      status: 500
      latency: 1s
  async: true
  topic: events.6
- name: step_2
  protocol: http
  mock:
    response:
      status: 502
      latency: 50ms
  wait_for:
  - step_0
  endpoint: /api/v1/resource/439
  method: DELETE
- name: step_3
  protocol: database
  mock:
    response:
      status: 503
      latency: 50ms
  query: SELECT * FROM table_6
- name: step_4
  protocol: http
  mock:
    response:
      status: 403
      latency: 1s
  endpoint: /api/v1/resource/381
  method: GET
- name: step_5
  protocol: database
  mock:
    response:
      status: 500
      latency: 50ms
  async: true
  wait_for:
  - step_3
  query: SELECT * FROM table_5
- name: step_6
  protocol: database
  mock:
    response:
      status: 403
      latency: ${$random.int(10,100)}ms
  query: SELECT * FROM table_3
- name: step_7
  protocol: kafka
  mock:
    response:
      status: 204
      latency: 500ms
  topic: events.58
- name: step_8
  protocol: database
  mock:
    response:
      status: 403
      latency: 50ms
  query: SELECT * FROM table_8
