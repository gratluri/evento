test: sales.buyflow.mock.validate_async_http_mock200_92
description: Validating async_http_mock200 behaviors at scale
config:
  virtual_users: 1
  mock_strategy: required
scenario:
- name: step_0
  protocol: http
  mock:
    response:
      status: 201
      latency: 200ms
  endpoint: /api/v1/resource/934
  method: PUT
- name: step_1
  protocol: http
  mock:
    response:
      status: 502
      latency: 200ms
  endpoint: /api/v1/resource/330
  method: POST
- name: step_2
  protocol: database
  mock:
    response:
      status: 403
      latency: 50ms
  query: SELECT * FROM table_1
- name: step_3
  protocol: http
  mock:
    response:
      status: 400
      latency: 500ms
  endpoint: /api/v1/resource/525
  method: GET
- name: step_4
  protocol: database
  mock:
    response:
      status: 404
      latency: 50ms
  async: true
  wait_for:
  - step_0
  query: SELECT * FROM table_8
- name: step_5
  protocol: kafka
  mock:
    response:
      status: 400
      latency: ${$random.int(10,100)}ms
  wait_for:
  - step_4
  topic: events.61
- name: step_6
  protocol: http
  mock:
    response:
      status: 401
      latency: 100ms
  endpoint: /api/v1/resource/167
  method: PUT
- name: step_7
  protocol: kafka
  mock:
    response:
      status: 204
      latency: 200ms
  topic: events.85
- name: step_8
  protocol: database
  mock:
    response:
      status: 200
      latency: ${$random.int(10,100)}ms
  async: true
  query: SELECT * FROM table_2
