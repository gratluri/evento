test: demo.async.cassandra
description: "Demonstrate temporal polling using within"
config:
  virtual_users: 1
  duration_ms: 15000

scenario:
  - name: trigger_async_audit
    protocol: http
    endpoint: http://localhost:8080/api/v1/demo/async-audit
    method: POST
    headers:
      Content-Type: application/json
    body:
      user_id: "user-test-async"
      trace_id: "demo-trace-async"
    extract:
      request_user_id: request.body.user_id
    validate:
      - response.status_code == 202

  - name: verify_cassandra_async_write
    protocol: cassandra
    endpoint: 127.0.0.1:9042
    body: "SELECT * FROM mykeyspace.audit_logs WHERE user_id = '${request_user_id}' ALLOW FILTERING"
    within: 5s
    validate:
      - json.row_count > 0
